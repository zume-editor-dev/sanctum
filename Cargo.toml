[package]
name = "sanctum"
version = "0.14.0"
edition = "2021"
rust-version = "1.70"
license = "Apache-2.0"
description = "Authorized-scope reconnaissance companion for Zume Editor: runs scoped recon and emits result-format-v1 JSON. Authorized security testing only."
repository = "https://github.com/zume-editor-dev/sanctum"
readme = "README.md"
keywords = ["security", "pentest", "recon", "authorized", "zume"]
categories = ["command-line-utilities"]

# Tiers T0 / T1 are std-only. The T2 web-diagnostic tier (ADR 0001) needs a
# correct HTTPS client, so it uses ureq (synchronous) over rustls - no OpenSSL,
# no async runtime. The dependency set is kept small and pinned in Cargo.lock.
[dependencies]
ureq = "2"

[[bin]]
name = "sanctum"
path = "src/main.rs"

[profile.release]
opt-level = "s"
lto = true
strip = true
